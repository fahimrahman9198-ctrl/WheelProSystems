<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hero Cursor Clean</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Saira+Semi+Condensed:wght@500;600&display=swap" rel="stylesheet" />
<style>
  @font-face { font-family: Switzer; src: url("../app/fonts/switzer-variable.woff2") format("woff2"); font-weight: 100 900; }
  :root {
    --bg: #fcfbf8; --bg-subtle: #f5f3ee; --bg-muted: #ece9e2; --line: #e6e2da; --line-strong: #d6d1c6;
    --ink: #14130f; --ink-2: #45423b; --ink-3: #6e6a61; --accent: #9a5b1e; --success: #15803d;
    --font-display: "Saira Semi Condensed";
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: var(--bg); color: var(--ink); font-family: Switzer, Arial, sans-serif; }
  .hero { position: relative; height: 100svh; min-height: 680px; overflow: hidden; }
  #fx { position: absolute; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; }
  .dial { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
  .nav { position: absolute; top: 0; left: 0; right: 0; z-index: 3; display: flex; justify-content: space-between; align-items: center; padding: 18px 48px;
    background: linear-gradient(180deg, rgba(252,251,248,.74), rgba(252,251,248,.52));
    -webkit-backdrop-filter: blur(18px) saturate(1.5); backdrop-filter: blur(18px) saturate(1.5);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.75), inset 0 -1px 0 rgba(255,255,255,.4), 0 10px 30px -18px rgba(20,19,15,.22); }
  .logo { font-weight: 700; font-size: 19px; letter-spacing: -0.01em; }
  .logo span { font-weight: 400; }
  .nav a.b { background: var(--ink); color: var(--bg); text-decoration: none; height: 44px; padding: 0 20px; border-radius: 6px; display: inline-flex; align-items: center; font-size: 15px; font-weight: 500; }
  .copy { position: relative; z-index: 2; height: 100%; display: flex; align-items: center; padding: 40px 48px 0; max-width: 1104px; margin: 0 auto; pointer-events: none; }
  .copy > div { max-width: 720px; }
  .copy a { pointer-events: auto; }
  .label { font-size: 12px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 24px; }
  h1 { font-family: var(--font-display), sans-serif; font-size: clamp(2.5rem, 5.2vw, 4.75rem); font-weight: 600; line-height: 1.02; }
  .sub { font-size: clamp(1.125rem, 1.4vw, 1.25rem); line-height: 1.55; letter-spacing: -0.01em; color: var(--ink-2); margin-top: 28px; max-width: 44ch; }
  .cta { display: flex; gap: 24px; align-items: center; margin-top: 40px; }
  .btn { display: inline-flex; align-items: center; gap: 14px; background: var(--ink); color: #fff; text-decoration: none; height: 52px; padding: 0 22px 0 6px; border-radius: 6px; font-weight: 500; font-size: 16px; }
  .btn i { width: 40px; height: 40px; border-radius: 4px; background: var(--accent); display: grid; place-items: center; font-style: normal; }
  .ghost { color: var(--ink); font-weight: 500; text-decoration: none; border-bottom: 1px solid var(--line-strong); padding-bottom: 2px; }

  .switch { position: fixed; z-index: 10; left: 50%; bottom: 20px; transform: translateX(-50%); width: min(760px, calc(100% - 32px));
    background: rgba(20,19,15,.92); color: #fbf9f4; border-radius: 12px; padding: 8px; box-shadow: 0 12px 40px -10px rgba(20,19,15,.4); }
  .tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
  .tabs button { flex: 1 0 auto; height: 40px; padding: 0 14px; border: 0; border-radius: 6px; background: transparent; color: #aaa49a; font: 500 14px Switzer, sans-serif; cursor: pointer; white-space: nowrap; }
  .tabs button[aria-selected="true"] { background: #fbf9f4; color: #14130f; }
  .tabs button:hover:not([aria-selected="true"]) { color: #fbf9f4; }
  .desc { font-size: 13px; line-height: 1.45; color: #cfc9be; padding: 10px 10px 6px; }
  .desc b { color: #fbf9f4; font-weight: 600; }

  @media (max-width: 1023px) {
    .nav { padding: 16px 20px; }
    .copy { align-items: flex-start; padding: 128px 20px 0; }
    .dial { opacity: .5; }
  }

  
.dial-stroke,
.dial-thin,
.dial-line {
  fill: none;
  stroke: var(--ink);
  stroke-width: 1;
}
.dial-stroke {
  stroke-opacity: 0.72;
}
.dial-thin {
  stroke-opacity: 0.3;
  stroke-dasharray: 3 5;
}
.dial-line {
  stroke: var(--ink-3);
}
.dial-tread {
  stroke: var(--ink);
  stroke-opacity: 0.2;
}
.dial-tick {
  stroke: var(--ink);
  stroke-opacity: 0.35;
}
.dial-tick.major {
  stroke-opacity: 0.8;
}
.dial-tick.red {
  stroke: #e5484d;
  transition: stroke 0.4s;
}
.dial-red {
  fill: none;
  stroke: #e5484d;
  stroke-width: 3;
  transition: stroke 0.4s;
}
.dial-ok .dial-tick.red,
.dial-ok .dial-red {
  stroke: var(--success);
}
.dial-num {
  font-family: var(--font-display);
  font-size: 14px;
  font-weight: 500;
  fill: var(--ink-2);
}
.dial-needle {
  stroke: var(--accent);
  stroke-width: 2.5;
  stroke-linecap: round;
}
.dial-curve.big {
  font-family: var(--font-display);
  font-size: 30px;
  font-weight: 600;
  letter-spacing: -0.02em;
  fill: var(--ink);
}
.dial-curve.small {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.03em;
  fill: var(--ink-3);
}
.dial-curve.small .rp {
  font-weight: 600;
  font-size: 13px;
  letter-spacing: 0;
  fill: var(--accent);
  font-variant-numeric: tabular-nums;
}


</style>
</head>

<script>
const EFFECTS = [
  { id: "glow", name: "6 · Soft glow", desc: "<b>Soft glow.</b> Nothing but paper and one large, soft bronze light that drifts after the mouse with a gentle lag." },
  { id: "reveal", name: "7 · Grid reveal", desc: "<b>Grid reveal.</b> The paper looks plain. A fine drafting grid appears only around the mouse, like a torch over a blueprint." },
  { id: "lines", name: "8 · Flow lines", desc: "<b>Flow lines.</b> Thin horizontal hairlines that bend smoothly around the mouse, like air over a car body." },
  { id: "rings", name: "9 · Dial rings", desc: "<b>Dial rings.</b> Faint rings spread out from the speedometer. The ring under the mouse lights up in bronze, tying the background to the dial." },
  { id: "needles", name: "10 · Needle field", desc: "<b>Needle field.</b> A sparse field of short ticks that all turn to point at the mouse, like little gauge needles." },
];

const hero = document.querySelector(".hero");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let canvas = document.getElementById("fx");
let W = 0, H = 0, dpr = 1, raf = 0, stop = () => {};

// Shared pointer: real mouse when present, otherwise a slow automatic drift.
const ptr = { x: 0, y: 0, sx: 0, sy: 0, px: 0, py: 0, speed: 0, last: -1e9 };
hero.addEventListener("pointermove", (e) => {
  const r = hero.getBoundingClientRect();
  ptr.x = e.clientX - r.left; ptr.y = e.clientY - r.top; ptr.last = performance.now();
});
function tickPointer(t) {
  if (t - ptr.last > 2500) {
    const s = t / 1000;
    ptr.x = W * (0.62 + 0.25 * Math.sin(s * 0.35));
    ptr.y = H * (0.5 + 0.3 * Math.sin(s * 0.53 + 1));
  }
  ptr.px = ptr.sx; ptr.py = ptr.sy;
  ptr.sx += (ptr.x - ptr.sx) * 0.12; ptr.sy += (ptr.y - ptr.sy) * 0.12;
  const v = Math.hypot(ptr.sx - ptr.px, ptr.sy - ptr.py);
  ptr.speed += (Math.min(v / 30, 1) - ptr.speed) * 0.08;
}

function freshCanvas() {
  const c = document.createElement("canvas");
  c.id = "fx"; c.setAttribute("aria-hidden", "true");
  canvas.replaceWith(c); canvas = c;
}
function size(scale) {
  W = hero.clientWidth; H = hero.clientHeight; dpr = Math.min(devicePixelRatio || 1, 2) * scale;
  canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
}

// ---------- WebGL helpers (effects 1 and 2) ----------
const VERT = "attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}";
const NOISE = `
precision highp float;
uniform vec2 R; uniform float T; uniform vec2 M; uniform float S;
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
  return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<5;i++){v+=a*n(p);p=p*2.03+vec2(1.7,9.2);a*=.5;}return v;}
const vec3 PAPER=vec3(.988,.984,.973), CREAM=vec3(.925,.906,.871), BRONZE=vec3(.604,.357,.118);
`;
const FRAG_PAINT = NOISE + `
void main(){
  vec2 uv=gl_FragCoord.xy/R.y, mp=M/R.y, d=uv-mp;
  float a=(1.3+S*6.5)*exp(-dot(d,d)*6.);
  float c=cos(a), s=sin(a);
  vec2 p=(mp+mat2(c,-s,s,c)*d)*1.7;
  vec2 q=vec2(fbm(p+T*.03), fbm(p+vec2(5.2,1.3)-T*.025));
  vec2 r=vec2(fbm(p+3.*q+vec2(1.7,9.2)+T*.04), fbm(p+3.*q+vec2(8.3,2.8)));
  float f=fbm(p+3.*r);
  vec3 col=mix(PAPER, CREAM*.97, smoothstep(.3,.8,f));
  col=mix(col, BRONZE, smoothstep(.56,.95,f)*.36);
  gl_FragColor=vec4(col,1.);
}`;
const FRAG_COAT = NOISE + `
float peel(vec2 p){return n(p)+.5*n(p*2.3+3.1);}
void main(){
  vec2 uv=gl_FragCoord.xy/R.y, mp=M/R.y, d=uv-mp;
  vec2 p=uv*110.;
  float e=.06, h0=peel(p);
  vec3 N=normalize(vec3((h0-peel(p+vec2(e,0.)))*1.2,(h0-peel(p+vec2(0.,e)))*1.2,1.));
  vec3 L=normalize(vec3(-d,.32)), H=normalize(L+vec3(0,0,1));
  float glow=exp(-dot(d,d)*6.);
  float spec=pow(max(dot(N,H),0.),70.);
  float band=exp(-pow(dot(d,normalize(vec2(1.,-.55))),2.)*55.)*exp(-dot(d,d)*1.4);
  vec3 col=PAPER-vec3(.028,.032,.04)*(1.-glow);
  col+=vec3(1.,.95,.86)*(spec*glow*.5+band*.05);
  col=mix(col,BRONZE,glow*.05);
  gl_FragColor=vec4(col,1.);
}`;
function glEffect(frag) {
  size(0.6);
  const gl = canvas.getContext("webgl", { antialias: false, premultipliedAlpha: false });
  if (!gl) return null;
  const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s)); return s; };
  const pr = gl.createProgram();
  gl.attachShader(pr, sh(gl.VERTEX_SHADER, VERT)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, frag));
  gl.linkProgram(pr); gl.useProgram(pr);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,3,-1,-1,3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(pr, "p"); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  const U = (k) => gl.getUniformLocation(pr, k);
  const uR = U("R"), uT = U("T"), uM = U("M"), uS = U("S");
  return (t) => {
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.uniform2f(uR, canvas.width, canvas.height);
    gl.uniform1f(uT, t / 1000);
    gl.uniform2f(uM, ptr.sx * dpr, (H - ptr.sy) * dpr);
    gl.uniform1f(uS, ptr.speed);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  };
}

// ---------- Canvas 2D effects (3, 4, 5) ----------
function mist() {
  size(1); const g = canvas.getContext("2d");
  const sprite = document.createElement("canvas"); sprite.width = sprite.height = 64;
  const sg = sprite.getContext("2d"), rg = sg.createRadialGradient(32, 32, 0, 32, 32, 32);
  rg.addColorStop(0, "rgba(154,91,30,.3)"); rg.addColorStop(.5, "rgba(170,120,70,.1)"); rg.addColorStop(1, "rgba(170,120,70,0)");
  sg.fillStyle = rg; sg.fillRect(0, 0, 64, 64);
  const P = [];
  return (t) => {
    g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);
    const dx = ptr.sx - ptr.px, dy = ptr.sy - ptr.py, v = Math.hypot(dx, dy);
    const n = Math.min(14, Math.round(v * 0.6)) + (t - ptr.last > 2500 ? 2 : 0);
    for (let i = 0; i < n && P.length < 1400; i++) {
      const k = Math.random();
      P.push({ x: ptr.px + dx * k + (Math.random() - .5) * 10, y: ptr.py + dy * k + (Math.random() - .5) * 10,
        vx: dx * .08 + (Math.random() - .5) * 1.2, vy: dy * .08 + (Math.random() - .5) * 1.2 - .1,
        r: 10 + Math.random() * 34, life: 1, decay: .006 + Math.random() * .01 });
    }
    for (let i = P.length - 1; i >= 0; i--) {
      const p = P[i]; p.x += p.vx; p.y += p.vy; p.vx *= .96; p.vy *= .96; p.r *= 1.006; p.life -= p.decay;
      if (p.life <= 0) { P.splice(i, 1); continue; }
      g.globalAlpha = p.life * p.life * .4; g.drawImage(sprite, p.x - p.r, p.y - p.r, p.r * 2, p.r * 2);
    }
    g.globalAlpha = 1;
  };
}

function grid() {
  size(1); const g = canvas.getContext("2d"); const gap = 30, R2 = 2 * 170 * 170;
  return () => {
    g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);
    for (let y = gap / 2; y < H; y += gap) for (let x = gap / 2; x < W; x += gap) {
      const dx = ptr.sx - x, dy = ptr.sy - y, f = Math.exp(-(dx * dx + dy * dy) / R2);
      const px = x + dx * f * .19, py = y + dy * f * .19, r = .8 + f * 1.8;
      g.fillStyle = f > .02 ? `rgba(${Math.round(110 + 44 * f)},${Math.round(106 - 15 * f)},${Math.round(97 - 67 * f)},${.08 + .32 * f})` : "rgba(110,106,97,.08)";
      g.beginPath(); g.arc(px, py, r, 0, 6.2832); g.fill();
    }
  };
}

function flakes() {
  size(1); const g = canvas.getContext("2d");
  const N = Math.round(Math.min(1800, W * H / 700)), F = [];
  for (let i = 0; i < N; i++) F.push({ x: Math.random() * W, y: Math.random() * H, hx: 0, hy: 0, vx: 0, vy: 0,
    s: .8 + Math.random() * 1.8, ph: Math.random() * 6.28, tone: Math.random() });
  F.forEach((f) => { f.hx = f.x; f.hy = f.y; });
  return (t) => {
    g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);
    const s = t / 1000;
    for (const f of F) {
      f.hx += Math.sin(s * .2 + f.ph) * .05; f.hy += .03 + Math.cos(s * .17 + f.ph) * .03;
      if (f.hy > H + 4) { f.hy = -4; f.y = -4; }
      const dx = f.x - ptr.sx, dy = f.y - ptr.sy, d = Math.hypot(dx, dy) || 1, near = Math.max(0, 1 - d / 200);
      f.vx += dx / d * near * 1.6 + (f.hx - f.x) * .02; f.vy += dy / d * near * 1.6 + (f.hy - f.y) * .02;
      f.vx *= .86; f.vy *= .86; f.x += f.vx; f.y += f.vy;
      const glint = near * Math.pow(Math.abs(Math.sin(f.ph + s * 2.4 + d * .04)), 3);
      g.fillStyle = glint > .05 ? `rgba(255,236,200,${.35 + glint * .65})`
        : f.tone > .55 ? "rgba(154,91,30,.28)" : "rgba(110,106,97,.22)";
      const z = f.s + glint * 1.6; g.fillRect(f.x, f.y, z, z);
    }
  };
}


// ---------- Clean set (6-10) ----------
function glow() {
  size(1); const g = canvas.getContext("2d"); const q = { x: ptr.sx, y: ptr.sy };
  return () => {
    q.x += (ptr.sx - q.x) * .06; q.y += (ptr.sy - q.y) * .06;
    g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);
    const r = Math.max(W, H) * .42, rg = g.createRadialGradient(q.x, q.y, 0, q.x, q.y, r);
    rg.addColorStop(0, "rgba(154,91,30,.13)"); rg.addColorStop(.45, "rgba(154,91,30,.05)"); rg.addColorStop(1, "rgba(154,91,30,0)");
    g.fillStyle = rg; g.fillRect(0, 0, W, H);
  };
}

function reveal() {
  size(1); const g = canvas.getContext("2d");
  const off = document.createElement("canvas"); off.width = canvas.width; off.height = canvas.height;
  const o = off.getContext("2d"); o.setTransform(dpr, 0, 0, dpr, 0, 0);
  const gap = 40;
  o.strokeStyle = "rgba(110,106,97,.32)"; o.lineWidth = .6; o.beginPath();
  for (let x = gap / 2; x < W; x += gap) { o.moveTo(x, 0); o.lineTo(x, H); }
  for (let y = gap / 2; y < H; y += gap) { o.moveTo(0, y); o.lineTo(W, y); }
  o.stroke();
  o.strokeStyle = "rgba(110,106,97,.14)"; o.lineWidth = .5; o.beginPath();
  for (let x = gap / 2 + gap / 2; x < W; x += gap) { o.moveTo(x, 0); o.lineTo(x, H); }
  for (let y = gap; y < H; y += gap) { o.moveTo(0, y); o.lineTo(W, y); }
  o.stroke();
  return () => {
    g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, canvas.width, canvas.height);
    g.globalCompositeOperation = "source-over"; g.drawImage(off, 0, 0);
    g.globalCompositeOperation = "destination-in";
    const x = ptr.sx * dpr, y = ptr.sy * dpr, r = 260 * dpr, rg = g.createRadialGradient(x, y, 0, x, y, r);
    rg.addColorStop(0, "rgba(0,0,0,1)"); rg.addColorStop(.55, "rgba(0,0,0,.45)"); rg.addColorStop(1, "rgba(0,0,0,0)");
    g.fillStyle = rg; g.fillRect(0, 0, canvas.width, canvas.height);
    g.globalCompositeOperation = "source-over";
  };
}

function lines() {
  size(1); const g = canvas.getContext("2d"); const gap = 28, step = 10;
  return () => {
    g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H); g.lineWidth = .8;
    for (let y = gap / 2; y < H; y += gap) {
      const dyl = y - ptr.sy, sideY = Math.exp(-(dyl * dyl) / (2 * 90 * 90));
      g.strokeStyle = `rgba(${Math.round(110 + 44 * sideY)},${Math.round(106 - 15 * sideY)},${Math.round(97 - 67 * sideY)},${.13 + .22 * sideY})`;
      g.beginPath();
      for (let x = 0; x <= W + step; x += step) {
        const dx = x - ptr.sx, f = Math.exp(-(dx * dx) / (2 * 130 * 130)) * sideY;
        const yy = y + Math.sign(dyl || 1) * f * 26;
        x ? g.lineTo(x, yy) : g.moveTo(x, yy);
      }
      g.stroke();
    }
  };
}

function rings() {
  size(1); const g = canvas.getContext("2d");
  const sc = Math.min(W / 1440, H / 900), cx = W - 1440 * sc + 1430 * sc, cy = H - 900 * sc + 866 * sc;
  const r0 = 470 * sc, step = 26, rMax = Math.hypot(cx, cy) + 20;
  return (t) => {
    g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);
    g.fillStyle = "#f3f0e9"; g.fillRect(0, 0, W, H);
    const pd = Math.hypot(ptr.sx - cx, ptr.sy - cy), pa = Math.atan2(ptr.sy - cy, ptr.sx - cx);
    for (let r = r0; r < rMax; r += step) {
      const k = Math.exp(-((r - pd) ** 2) / (2 * 26 * 26));
      g.lineWidth = .8 + k * .6;
      g.strokeStyle = `rgba(110,106,97,${.045 + .035 * k})`;
      g.beginPath(); g.arc(cx, cy, r, Math.PI, Math.PI * 1.5); g.stroke();
      if (k > .03) {
        g.strokeStyle = `rgba(154,91,30,${.38 * k})`;
        g.beginPath(); g.arc(cx, cy, r, pa - .22, pa + .22); g.stroke();
      }
    }
  };
}

function needles() {
  size(1); const g = canvas.getContext("2d"); const gap = 38, P = [];
  for (let y = gap / 2; y < H; y += gap) for (let x = gap / 2; x < W; x += gap) P.push({ x, y, a: -Math.PI / 4 });
  return () => {
    g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H); g.lineCap = "round";
    for (const p of P) {
      const dx = ptr.sx - p.x, dy = ptr.sy - p.y, d = Math.hypot(dx, dy), k = Math.exp(-(d * d) / (2 * 180 * 180));
      let target = Math.atan2(dy, dx), diff = ((target - p.a + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
      p.a += diff * .12;
      const L = 4 + k * 4, c = Math.cos(p.a) * L, s = Math.sin(p.a) * L;
      g.lineWidth = 1 + k * .4;
      g.strokeStyle = k > .05 ? `rgba(${Math.round(110 + 44 * k)},${Math.round(106 - 15 * k)},${Math.round(97 - 67 * k)},${.1 + .45 * k})` : "rgba(110,106,97,.1)";
      g.beginPath(); g.moveTo(p.x - c, p.y - s); g.lineTo(p.x + c, p.y + s); g.stroke();
    }
  };
}

const MAKERS = { paint: () => glEffect(FRAG_PAINT), coat: () => glEffect(FRAG_COAT), mist, grid, flakes, glow, reveal, lines, rings, needles };

function run(id) {
  cancelAnimationFrame(raf); freshCanvas();
  ptr.sx = ptr.x = ptr.x || hero.clientWidth * .62; ptr.sy = ptr.y = ptr.y || hero.clientHeight * .5;
  const draw = MAKERS[id]();
  if (!draw) return;
  const loop = (t) => { if (!document.hidden) { tickPointer(t); draw(t); } if (!reduce) raf = requestAnimationFrame(loop); };
  raf = requestAnimationFrame(loop);
}

const tabs = document.querySelector(".tabs"), desc = document.getElementById("desc");
let current = new URLSearchParams(location.search).get("fx") || "glow";
function select(id) {
  current = id;
  tabs.querySelectorAll("button").forEach((b) => b.setAttribute("aria-selected", b.dataset.id === id));
  desc.innerHTML = EFFECTS.find((e) => e.id === id).desc;
  history.replaceState(null, "", "?fx=" + id);
  run(id);
}
EFFECTS.forEach((e) => {
  const b = document.createElement("button"); b.role = "tab"; b.dataset.id = e.id; b.textContent = e.name;
  b.onclick = () => select(e.id); tabs.appendChild(b);
});
let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => run(current), 150); });
select(current);
</script>
</body>
