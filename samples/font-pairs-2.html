<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Font Pairings 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Savate:wght@400;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=DM+Serif+Display&family=Syne:wght@400;500;600;700&family=Unbounded:wght@500;600;700&family=Zilla+Slab:wght@400;500;600;700&family=Cinzel:wght@500;600;700&family=Big+Shoulders+Display:wght@600;700;800&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root { --bg: #fcfbf8; --hero: #f3f0e9; --subtle: #f5f3ee; --line: #e6e2da; --line-strong: #d6d1c6; --ink: #14130f; --ink-2: #45423b; --ink-3: #6e6a61; --accent: #9a5b1e; --dark: #15130f; --on-dark: #fbf9f4; --on-dark-2: #b3ada2; }
  * { box-sizing: border-box; margin: 0; }
  body { background: #e9e7e2; color: var(--ink); font-family: system-ui, sans-serif; padding: 32px 16px 80px; }
  .page { max-width: 1180px; margin: 0 auto; }
  .intro { font-size: 15px; color: var(--ink-2); max-width: 70ch; line-height: 1.55; }
  .intro h1 { font: 600 26px system-ui; color: var(--ink); margin-bottom: 8px; }
  .sample { margin-top: 40px; border-radius: 14px; overflow: hidden; background: var(--bg); border: 1px solid var(--line); }
  .bar { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 14px 24px; background: var(--dark); color: var(--on-dark-2); font: 500 13px system-ui; }
  .bar b { color: var(--on-dark); font-weight: 600; }
  .hero { background: var(--hero); padding: 64px clamp(20px, 5vw, 56px) 56px; }
  .label { font-family: var(--b); font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
  .hero h2 { font-family: var(--h); font-weight: var(--hw); font-size: clamp(2.4rem, 5.4vw, 4.4rem); line-height: 1.04; letter-spacing: var(--hls); margin-top: 18px; max-width: 14ch; }
  .hero p { font-family: var(--b); font-size: clamp(1.05rem, 1.4vw, 1.22rem); line-height: 1.6; color: var(--ink-2); margin-top: 22px; max-width: 46ch; }
  .cta { display: flex; gap: 22px; align-items: center; margin-top: 32px; flex-wrap: wrap; }
  .btn { font-family: var(--b); display: inline-flex; align-items: center; gap: 14px; height: 52px; padding: 0 24px 0 6px; border-radius: 6px; background: var(--ink); color: #fff; font-weight: 700; font-size: 16px; text-decoration: none; }
  .btn i { width: 40px; height: 40px; border-radius: 4px; background: var(--accent); display: grid; place-items: center; font-style: normal; }
  .ghost { font-family: var(--b); font-weight: 600; color: var(--ink); border-bottom: 1px solid var(--line-strong); }
  .row { display: grid; gap: 24px; padding: 48px clamp(20px, 5vw, 56px); }
  @media (min-width: 900px) { .row { grid-template-columns: 1fr 1fr; } }
  .row h3 { font-family: var(--h); font-weight: var(--hw); font-size: clamp(1.8rem, 3vw, 2.5rem); line-height: 1.08; letter-spacing: var(--hls); }
  .row .lede { font-family: var(--b); font-size: 16px; line-height: 1.65; color: var(--ink-2); margin-top: 14px; }
  .card { background: var(--dark); color: var(--on-dark); border-radius: 12px; padding: 26px; }
  .card h4 { font-family: var(--h); font-weight: var(--hw); font-size: 26px; letter-spacing: var(--hls); }
  .card p { font-family: var(--b); color: var(--on-dark-2); font-size: 15px; line-height: 1.6; margin-top: 8px; }
  .card .num { font-family: var(--h); font-size: 44px; color: #c98a4b; margin-top: 18px; font-weight: var(--hw); }
  .card .tags { font-family: var(--b); font-size: 14px; font-weight: 600; color: #d7d1c6; margin-top: 18px; line-height: 1.7; }
  .faq { padding: 0 clamp(20px, 5vw, 56px) 48px; }
  .q { font-family: var(--b); display: flex; justify-content: space-between; gap: 16px; padding: 18px 0; border-top: 1px solid var(--line-strong); font-size: 18px; font-weight: 600; }
  .q:last-child { border-bottom: 1px solid var(--line-strong); }
  .q span { color: var(--ink-3); font-weight: 400; }
  .why { padding: 0 clamp(20px, 5vw, 56px) 36px; font: 14px/1.6 system-ui; color: var(--ink-2); }
</style>
</head>
<body>
<div class="page">
  <div class="intro">
    <h1>Font pairings</h1>
    <p>Five heading + body pairings from your "10 free fonts" list, on real WheelPro content. Savate is the real font. The other fonts are free downloads from small foundries that can't be loaded directly, so each uses its closest free Google Fonts lookalike (named in each bar).</p>
  </div>
  <div id="samples"></div>
</div>
<script>
const P = [
  { n: "1 · Savate + Sporting Grotesque", h: "Savate", hw: 800, hls: "-0.02em", b: "'Space Grotesk'", sub: "Savate (real) · Sporting Grotesque → Space Grotesk",
    why: "Bold and sporty. Savate's chunky, athletic headings feel like motorsport branding; the techy grotesque body keeps it modern. The most energetic option." },
  { n: "2 · Halibat Serif + Cyrene", h: "'DM Serif Display'", hw: 400, hls: "-0.01em", b: "Syne", sub: "Halibat Serif → DM Serif Display · Cyrene → Syne",
    why: "Editorial and premium. A high-contrast serif for headings with a distinctive wide sans for body. Feels like a design-led agency or a luxury detailing brand." },
  { n: "3 · Moche + Kraken Slab", h: "Unbounded", hw: 700, hls: "-0.02em", b: "'Zilla Slab'", sub: "Moche → Unbounded · Kraken Slab Air → Zilla Slab",
    why: "Industrial and loud. Wide, heavy headings with a slab-serif body that feels like workshop signage and spec sheets. The most garage-like." },
  { n: "4 · Daubenton + Sporting Grotesque", h: "Cinzel", hw: 600, hls: "0.01em", b: "'Space Grotesk'", sub: "Daubenton → Cinzel · Sporting Grotesque → Space Grotesk",
    why: "Classic meets technical. Engraved, all-caps headings with a crisp modern body. Feels established and premium, a bit like a heritage car badge." },
  { n: "5 · Le Murmure + Sprat", h: "'Big Shoulders Display'", hw: 800, hls: "0", b: "'Playfair Display'", sub: "Le Murmure → Big Shoulders Display · Sprat → Playfair Display",
    why: "Striking and condensed. Tall, narrow headings stack big words in little space; the elegant serif body adds refinement. The most fashion-forward." },
];
document.getElementById("samples").innerHTML = P.map((p) => `
<section class="sample" style="--h:${p.h};--hw:${p.hw};--hls:${p.hls};--b:${p.b}">
  <div class="bar"><b>${p.n}</b><span>${p.sub}</span></div>
  <div class="hero">
    <p class="label">Built only for wheel refinishers</p>
    <h2>One-stop solution for wheel refinishing businesses</h2>
    <p>Leads from your website and Gmail get captured, quoted, followed up, invoiced and paid, all in one system.</p>
    <div class="cta"><a class="btn" href="#"><i>→</i>Book a meeting</a><span class="ghost">See how it works</span></div>
  </div>
  <div class="row">
    <div><h3>One job. Five steps. Zero chasing.</h3><p class="lede">WheelPro is shop management software for wheel repair and refinishing businesses. Lead capture, quoting, follow-ups, deposits and invoicing run as one system, from the first enquiry to money in the bank.</p></div>
    <div class="card"><h4>Automated follow-up</h4><p>Reminders go out on day 1 and day 3 and stop the moment the customer approves.</p><div class="tags">Quote reminders<br>Appointment reminders<br>Review requests</div><div class="num">03</div></div>
  </div>
  <div class="faq">
    <div class="q">Can the platform be customised to our business? <span>+</span></div>
    <div class="q">How are customer payments processed? <span>+</span></div>
  </div>
  <p class="why">${p.why}</p>
</section>`).join("");
</script>
</body>
</html>
